<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SIGAP — Instrumen Supervisi Akademik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F2EA; --surface:#FFFFFF; --ink:#23281F; --ink-soft:#5B6156;
    --primary:#1B4332; --primary-light:#52796F; --gold:#A9822C; --gold-soft:#E7D9AE;
    --border:#DCD6C4; --good:#2F6F4E; --mid:#B8862B; --bad:#A64B41;
    --font-display:'Lora',serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
    --radius:10px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5; }
  button{ font-family:var(--font-body); cursor:pointer; }
  input,select{ font-family:var(--font-body); }

  #app{ display:flex; flex-direction:column; height:100dvh; }

  /* ---------- Header ---------- */
  .app-header{
    flex:none; background:var(--surface); border-bottom:1px solid var(--border);
    padding: 10px 12px; display:flex; align-items:center; gap:8px; flex-wrap:nowrap;
    box-shadow:0 1px 2px rgba(23,30,20,0.05);
  }
  .seal{ flex:none; flex-shrink:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center; }
  .seal img{ width:100%; height:100%; object-fit:contain; display:block; }
  .brand{ flex:1 1 auto; min-width:0; overflow:hidden; text-align:center; }
  .brand .name{ font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--primary); line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand .sub{ font-size:9.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session-badge{ display:flex; align-items:center; gap:6px; flex:none; }
  .session-badge .who{ text-align:right; max-width:88px; overflow:hidden; }
  .session-badge .role{ font-size:9px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); white-space:nowrap; }
  .session-badge .nm{ font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon-btn{
    border:1px solid var(--border); background:#fff; border-radius:8px;
    padding:6px 9px; font-size:10.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap; flex:none;
  }
  .icon-btn:hover{ background:var(--bg); }
  @media (max-width:420px){
    .app-header{ gap:6px; padding:8px 10px; }
    .seal{ width:26px; height:26px; }
    .brand .sub{ display:none; }
    .brand .name{ font-size:13px; }
    .session-badge .who .role{ display:none; }
    .session-badge .who{ max-width:64px; }
    .icon-btn{ padding:5px 7px; font-size:9.5px; }
  }

  /* ---------- Main scroll area ---------- */
  .app-main{ flex:1; min-height:0; overflow-y:auto; padding: 16px; }
  .app-main.no-pad{ padding:0; }

  /* ---------- Footer nav ---------- */
  .app-footer{
    flex:none; background:var(--surface); border-top:1px solid var(--border);
    padding: 10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .steps-dots{ display:flex; gap:6px; }
  .steps-dots .dot{ width:8px; height:8px; border-radius:50%; background:var(--border); }
  .steps-dots .dot.active{ background:var(--primary); width:20px; border-radius:5px; transition: all .2s; }
  .steps-dots .dot.done{ background:var(--primary-light); }
  .btn{ font-weight:600; font-size:13px; padding:10px 18px; border-radius:999px; border:none; }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:hover{ background:#163A29; }
  .btn-primary:disabled{ background:#B9C4BC; cursor:not-allowed; }
  .btn-ghost{ background:#fff; color:var(--ink); border:1px solid var(--border); }
  .btn-ghost:hover{ background:var(--bg); }
  .tabbar{ display:flex; gap:6px; flex:1; }
  .tabbar button{ flex:1; border:1px solid var(--border); background:#fff; border-radius:8px; padding:9px 6px; font-size:11.5px; font-weight:600; color:var(--ink-soft); }
  .tabbar button.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

  /* ---------- Login screen ---------- */
  .center-wrap{ min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
  .login-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px 22px; max-width:400px; width:100%; }
  .login-card h1{ font-family:var(--font-display); font-size:19px; margin:12px 0 4px; color:var(--primary); }
  .login-card p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }
  .role-btn{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:#FCFBF7; border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px; font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .role-btn:hover{ border-color:var(--primary-light); background:#F4F2EA; }
  .role-btn .emoji{ font-size:20px; }
  .role-btn small{ display:block; font-weight:400; font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .form-mini{ text-align:left; margin-top:6px; }
  .form-mini label{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin:10px 0 4px; }
  .form-mini input, .form-mini select{
    width:100%; border:1px solid var(--border); border-radius:7px; padding:9px 10px; font-size:13.5px; background:#FCFBF7; color:var(--ink);
  }
  .form-mini input:focus, .form-mini select:focus{ outline:2px solid var(--primary-light); outline-offset:1px; border-color:var(--primary-light); }
  .note-small{ font-size:10.5px; color:var(--ink-soft); margin-top:10px; }
  .link-btn{ background:none; border:none; color:var(--primary-light); font-size:12px; font-weight:600; text-decoration:underline; padding:4px; }

  /* ---------- Cards / sections (reused) ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
  .card h2{ font-family:var(--font-display); font-size:13.5px; margin:0 0 12px; color:var(--primary); text-transform:uppercase; letter-spacing:0.05em; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
  .field label{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field select{ width:100%; border:1px solid var(--border); border-radius:7px; padding:9px 10px; font-size:13.5px; background:#FCFBF7; color:var(--ink); }
  .field input:focus, .field select:focus{ outline:2px solid var(--primary-light); outline-offset:1px; border-color:var(--primary-light); }
  .field-inline-btn{ display:flex; gap:8px; align-items:flex-end; }

  .group-title{ font-size:12.5px; font-weight:700; color:var(--primary-light); margin:14px 0 6px; }
  .group-title:first-child{ margin-top:0; }
  .item{ display:grid; grid-template-columns:1fr; gap:8px; padding:10px 0; border-top:1px solid #EFEBDD; }
  .group-title + .item{ border-top:none; }
  .item-text{ font-size:13px; }
  .item-controls{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .score-group{ display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
  .score-opt{ position:relative; }
  .score-opt input{ position:absolute; opacity:0; width:1px; height:1px; }
  .score-opt label{ display:block; cursor:pointer; font-family:var(--font-mono); font-size:11.5px; font-weight:600; padding:6px 11px; color:var(--ink-soft); background:#FCFBF7; white-space:nowrap; border-right:1px solid var(--border); }
  .score-opt:last-child label{ border-right:none; }
  .score-opt[data-val="2"] input:checked + label{ background:var(--good); color:#fff; }
  .score-opt[data-val="1"] input:checked + label{ background:var(--mid); color:#fff; }
  .score-opt[data-val="0"] input:checked + label{ background:var(--bad); color:#fff; }
  .note-input{ flex:1; min-width:140px; border:1px solid var(--border); border-radius:7px; padding:6px 9px; font-size:12.5px; background:#FCFBF7; color:var(--ink); }
  @media (min-width:640px){
    .item{ grid-template-columns:1.5fr 1.2fr; align-items:center; gap:14px; }
    .item-controls{ justify-content:flex-end; }
  }

  /* ---------- Gauge ---------- */
  .gauge-card{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .gauge{ flex:none; width:96px; height:96px; border-radius:50%; background:conic-gradient(var(--primary) calc(var(--pct,0)*1%), #E7E3D5 0); display:flex; align-items:center; justify-content:center; }
  .gauge-inner{ width:76px; height:76px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gauge-inner .num{ font-family:var(--font-mono); font-weight:600; font-size:19px; }
  .gauge-inner .lbl{ font-size:9px; color:var(--ink-soft); }
  .gauge-meta{ flex:1; min-width:180px; }
  .status-pill{ display:inline-block; font-family:var(--font-display); font-weight:700; font-size:14px; padding:3px 11px; border-radius:999px; background:var(--gold-soft); color:#6B5314; }
  .breakdown{ display:flex; gap:16px; margin-top:8px; flex-wrap:wrap; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); }

  /* ---------- Lists (guru/supervisor/arsip) ---------- */
  .list-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid #EFEBDD; }
  .list-row:first-child{ border-top:none; }
  .list-row .info{ min-width:0; }
  .list-row .info .t1{ font-weight:600; font-size:13px; }
  .list-row .info .t2{ font-size:11.5px; color:var(--ink-soft); }
  .list-row .badge{ font-family:var(--font-mono); font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px; }
  .badge-good{ background:#E1EEE5; color:var(--good); }
  .badge-mid{ background:#F3E7CC; color:var(--mid); }
  .badge-bad{ background:#F3DEDA; color:var(--bad); }
  .row-actions{ display:flex; gap:6px; flex:none; }
  .row-actions button{ border:1px solid var(--border); background:#fff; border-radius:7px; padding:5px 9px; font-size:11px; }
  .row-actions button.danger{ color:var(--bad); border-color:#EAD0CB; }
  .empty-state{ text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px; }

  /* ---------- Sign block ---------- */
  .sign-grid{ display:grid; grid-template-columns:1fr; gap:20px; margin-top:6px; }
  @media (min-width:560px){ .sign-grid{ grid-template-columns:1fr 1fr; } }
  .sign-block{ text-align:center; font-size:12.5px; }
  .sign-block .role-lbl{ color:var(--ink-soft); margin-bottom:44px; }
  .sign-block .name{ font-weight:700; text-decoration:underline; }
  .sign-block .nip{ font-size:11.5px; color:var(--ink-soft); }

  /* ---------- Print ---------- */
  #printArea{ display:none; }
  @media print{
    body{ overflow:visible; }
    #app > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; padding: 10mm; font-family:var(--font-body); color:#111; }
    #printArea h1{ font-family:var(--font-display); font-size:16px; margin:0 0 2px; }
    #printArea .ph-line{ font-size:11px; margin:0; }
    #printArea table{ width:100%; border-collapse:collapse; font-size:10.5px; margin-top:8px; }
    #printArea th,#printArea td{ border:1px solid #999; padding:4px 6px; text-align:left; vertical-align:top; }
    #printArea th{ background:#eee; }
    #printArea .sec-row td{ background:#f2f2f2; font-weight:700; }
  }
</style>

/* ============ STORAGE HELPERS (Firestore + localStorage) ============ */
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const COL = 'sigap';

async function getShared(key, fallback){
  try{
    const doc = await db.collection(COL).doc(key).get();
    if(!doc.exists) return fallback;
    const data = doc.data();
    return data && data.value !== undefined ? JSON.parse(data.value) : fallback;
  }catch(e){ console.error('Firestore get failed', key, e); return fallback; }
}
async function setShared(key, val){
  try{ await db.collection(COL).doc(key).set({ value: JSON.stringify(val), updatedAt: new Date().toISOString() }); }
  catch(e){ console.error('Firestore set failed', key, e); }
}
async function deleteShared(key){
  try{ await db.collection(COL).doc(key).delete(); }catch(e){ console.error('Firestore delete failed', key, e); }
}

// Personal/device data (draft in progress, remembered login) stays on this device only.
function getPersonal(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function setPersonal(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error('local set failed', e); }
}
function deletePersonal(key){ try{ localStorage.removeItem(key); }catch(e){} }

async function loadMaster(){
  state.masterGuru = await getShared('master-guru', []);
  state.masterSupervisor = await getShared('master-supervisor', []);
  state.jadwal = await getShared('jadwal', []);
}
async function loadHasilList(){
  try{
    const snap = await db.collection(COL)
      .where(firebase.firestore.FieldPath.documentId(), '>=', 'hasil:')
      .where(firebase.firestore.FieldPath.documentId(), '<', 'hasil:\uf8ff')
      .get();
    const records = [];
    snap.forEach(doc=>{
      const data = doc.data();
      if(data && data.value){ try{ records.push(JSON.parse(data.value)); }catch(e){} }
    });
    records.sort((a,b)=> (b.savedAt||'').localeCompare(a.savedAt||''));
    state.hasilList = records;
  }catch(e){ console.error('Firestore loadHasilList failed', e); state.hasilList = []; }
}

/* ============ CALC ============ */
function calcTotals(scores){
  const answered = Object.keys(scores||{}).length;
  const total = Object.values(scores||{}).reduce((a,b)=> a+b, 0);
  const nilai = MAX_SCORE ? Math.round((total/MAX_SCORE)*1000)/10 : 0;
  let status = 'Belum dinilai';
  if(answered>0){
    if(nilai>=91) status='Sangat Baik';
    else if(nilai>=81) status='Baik';
    else if(nilai>=71) status='Cukup';
    else status='Kurang';
  }
  return { answered, total, nilai, status };
}
function statusBadgeClass(status){
  if(status==='Sangat Baik'||status==='Baik') return 'badge-good';
  if(status==='Cukup') return 'badge-mid';
  if(status==='Kurang') return 'badge-bad';
  return '';
}
function fmtDate(iso){
  if(!iso) return '.....................';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('id-ID',{ day:'numeric', month:'long', year:'numeric' });
}

async function changeAdminPin(){
  const current = await getShared('admin-pin', null);
  if(current){
    const old = prompt('Masukkan PIN Admin saat ini:');
    if(old===null) return;
    if(old.trim()!==current){ alert('PIN saat ini salah.'); return; }
  }
  const next = prompt('Masukkan PIN Admin baru (4-6 digit angka):');
  if(next===null) return;
  if(!/^\d{4,6}$/.test(next.trim())){ alert('PIN harus 4-6 digit angka.'); return; }
  const confirmNext = prompt('Ulangi PIN baru:');
  if(confirmNext===null) return;
  if(confirmNext.trim()!==next.trim()){ alert('Konfirmasi PIN tidak cocok.'); return; }
  await setShared('admin-pin', next.trim());
  alert('PIN Admin berhasil diperbarui.');
}

function renderSupervisorHome(){

  );
  const myName = (state.session.name||'').trim().toLowerCase();
  const myJadwal = state.jadwal.filter(j=> (j.supervisor||'').trim().toLowerCase()===myName)
    .sort((a,b)=> a.tanggal.localeCompare(b.tanggal));

  const wrap = el(`<div>

        : `<div class="empty-state">Belum ada jadwal atas nama Anda.<br>Minta Admin mengimpor jadwal, dan pastikan nama akun Anda sama persis dengan yang tertulis di jadwal.</div>`}

      const done = doneGuruDates.has(key);
      const row = el(`<div class="list-row">
        <div class="info"><div class="t1">${j.guru}</div><div class="t2">${j.hari}, ${fmtDate(j.tanggal)} · ${j.mapel} · Jam ke-${j.jam} · ${j.kelas} · ${j.kampus}</div></div>

  return wrap;

async function startFromJadwal(j){
  const draft = { id:uid(), guruId:null, fields:{ mapel:'', kelasMateri:'', tempat:'Balikpapan', tanggal:'' }, scores:{}, notes:{} };
  if(j){
    const g = state.masterGuru.find(x=> x.nama.trim().toLowerCase()===j.guru.trim().toLowerCase());
    if(g) draft.guruId = g.id;
    draft.fields.mapel = j.mapel || '';
    draft.fields.kelasMateri = j.kelas ? `${j.kelas} / ${j.kampus}` : '';
    draft.fields.tanggal = j.tanggal || '';
    draft.fields.tempat = 'Balikpapan';
  }
  state.draft = draft;
  await setPersonal('draft', state.draft);
  state.step = 0; state.view='wizard';
  render();
}

/* ============ WIZARD ============ */
function currentGuru(){ return state.masterGuru.find(g=> g.id===state.draft.guruId); }

function renderWizardStep(){
  const step = state.step;
  if(step===0) return renderStepIdentitas();
  if(step===1) return renderStepSection(0);
  if(step===2) return renderStepSection(1);
  if(step===3) return renderStepSection(2);
  return renderStepRingkasan();
}

function renderStepSection(secIndex){
  const sec = DATA[secIndex];
  const wrap = el(`<div><div class="card"><h2>${sec.code}. ${sec.title}</h2><div id="secItems"></div></div></div>`);
  const holder = wrap.querySelector('#secItems');
  sec.groups.forEach(g=>{
    holder.appendChild(el(`<div class="group-title">${g.num}. ${g.title}</div>`));
    g.items.forEach(item=>{
      const scoreVal = state.draft.scores[item.id];
      const row = el(`<div class="item">
        <div class="item-text">${item.text}</div>
        <div class="item-controls">
          <div class="score-group" role="radiogroup">
            ${[2,1,0].map(v=> `<div class="score-opt" data-val="${v}">
              <input type="radio" name="score-${item.id}" id="${item.id}-${v}" value="${v}" ${scoreVal===v?'checked':''}>
              <label for="${item.id}-${v}">${v} · ${v===2?'Sudah Lengkap':v===1?'Kurang Lengkap':'Tidak'}</label>
            </div>`).join('')}
          </div>
          <input class="note-input" placeholder="Catatan" data-note="${item.id}" value="${(state.draft.notes[item.id]||'').replace(/"/g,'&quot;')}">
        </div>
      </div>`);
      row.querySelectorAll('input[type=radio]').forEach(r=>{
        r.addEventListener('change', async ()=>{ state.draft.scores[item.id] = Number(r.value); await setPersonal('draft', state.draft); });
      });
      row.querySelector('.note-input').addEventListener('input', async (e)=>{ state.draft.notes[item.id] = e.target.value; await setPersonal('draft', state.draft); });
      holder.appendChild(row);
    });
  });
  return wrap;
}

function currentRecordFromDraft(){
  const g = currentGuru();
  const { total, nilai, status } = calcTotals(state.draft.scores);
  return {
    id: state.draft.id, guruId: state.draft.guruId, guruNama: g?g.nama:'(belum dipilih)',
    mapel: state.draft.fields.mapel, kelasMateri: state.draft.fields.kelasMateri,
    supervisorId: state.session.id, supervisorNama: state.session.name, supervisorNip: state.session.nip,
    tempat: state.draft.fields.tempat, tanggal: state.draft.fields.tanggal,
    scores: state.draft.scores, notes: state.draft.notes,
    total, nilai, status, savedAt: new Date().toISOString(),
  };
}

async function saveToArchive(){
  if(!state.draft.guruId){ alert('Pilih guru yang disupervisi terlebih dahulu (langkah Identitas).'); state.step=0; render(); return; }
  const record = currentRecordFromDraft();
  await setShared('hasil:'+record.id, record);
  await deletePersonal('draft');
  await loadHasilList();
  alert('Hasil supervisi tersimpan ke arsip.');
  state.draft = null; state.view='supervisor-home';
  render();
}

function renderWizardFooter(){
  const foot = el(`<div class="app-footer">
    <button class="btn btn-ghost" id="prevBtn">Kembali</button>
    <div class="steps-dots">${WIZARD_STEPS.map((s,i)=> `<div class="dot ${i===state.step?'active':i<state.step?'done':''}"></div>`).join('')}</div>
    <button class="btn btn-primary" id="nextBtn">${state.step===WIZARD_STEPS.length-1 ? 'Selesai' : 'Lanjut'}</button>
  </div>`);
  foot.querySelector('#prevBtn').addEventListener('click', async ()=>{
    if(state.step===0){ if(confirm('Keluar dari pengisian? Draf akan tetap tersimpan sementara.')){ state.view='supervisor-home'; render(); } return; }
    state.step--; render();
  });
  foot.querySelector('#nextBtn').addEventListener('click', ()=>{
    if(state.step===WIZARD_STEPS.length-1){ state.view='supervisor-home'; render(); return; }
    if(state.step===0 && !state.draft.guruId){ if(!confirm('Guru belum dipilih. Lanjutkan tanpa memilih guru?')) return; }
    state.step++; render();
  });
  return foot;
}

  const r = state.hasilList.find(x=> x.id===state.viewingId);
  if(!r) return el(`<div class="empty-state">Data tidak ditemukan.</div>`);
  const wrap = el(`<div>
    <div class="card gauge-card">
      <div class="gauge" style="--pct:${Math.min(r.nilai,100)};"><div class="gauge-inner"><div class="num">${r.nilai.toFixed(1)}</div><div class="lbl">NILAI AKHIR</div></div></div>
      <div class="gauge-meta"><span class="status-pill">${r.status}</span>
        <div class="breakdown"><span>Skor: <b>${r.total}/${MAX_SCORE}</b></span><span>Tanggal: <b>${fmtDate(r.tanggal)}</b></span></div>
      </div>
    </div>
    <div class="card">
      <h2>Data Supervisi</h2>
      <div class="field-grid">
        <div class="field"><label>Guru</label><input readonly value="${r.guruNama||'-'}"></div>
        <div class="field"><label>Mata Pelajaran</label><input readonly value="${r.mapel||'-'}"></div>
        <div class="field"><label>Kelas/Materi</label><input readonly value="${r.kelasMateri||'-'}"></div>
        <div class="field"><label>Tempat</label><input readonly value="${r.tempat||'-'}"></div>
        <div class="field"><label>Supervisor</label><input readonly value="${r.supervisorNama||'-'}"></div>
        <div class="field"><label>NIP Supervisor</label><input readonly value="${r.supervisorNip||'-'}"></div>
      </div>
    </div>
    <div id="detailSections"></div>
  </div>`);
  const holder = wrap.querySelector('#detailSections');
  DATA.forEach(sec=>{
    const secCard = el(`<div class="card"><h2>${sec.code}. ${sec.title}</h2></div>`);
    sec.groups.forEach(g=>{
      secCard.appendChild(el(`<div class="group-title">${g.num}. ${g.title}</div>`));
      g.items.forEach(item=>{
        const val = r.scores ? r.scores[item.id] : undefined;
        const note = r.notes ? r.notes[item.id] : '';
        secCard.appendChild(el(`<div class="item">
          <div class="item-text">${item.text}</div>
          <div class="item-controls">
            <span class="badge ${val===2?'badge-good':val===1?'badge-mid':val===0?'badge-bad':''}" style="font-family:var(--font-mono);">${val!=null?val:'—'}</span>
            ${note?`<span style="font-size:11.5px;color:var(--ink-soft);">${note}</span>`:''}
          </div>
        </div>`));
      });
    });
    holder.appendChild(secCard);
  });
  return wrap;
}

function renderDetailFooter(){
  const foot = el(`<div class="app-footer">
    <button class="btn btn-ghost" id="backBtn">Kembali</button>
    <div></div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" id="delBtn">Hapus</button>
      <button class="btn btn-primary" id="printBtn">Cetak</button>
    </div>
  </div>`);
  foot.querySelector('#backBtn').addEventListener('click', ()=>{ state.view = state.session.role==='admin' ? 'admin' : 'supervisor-home'; render(); });
  foot.querySelector('#printBtn').addEventListener('click', ()=>{ const r = state.hasilList.find(x=> x.id===state.viewingId); buildPrintArea(r); window.print(); });
  foot.querySelector('#delBtn').addEventListener('click', async ()=>{
    if(!confirm('Hapus hasil supervisi ini dari arsip? Tindakan tidak dapat dibatalkan.')) return;
    try{ await deleteShared('hasil:'+state.viewingId); }catch(e){}
    await loadHasilList();
    state.view = state.session.role==='admin' ? 'admin' : 'supervisor-home';
    render();
  });
  return foot;
}

/* ============ PRINT ============ */
function buildPrintArea(r){
  const area = document.getElementById('printArea');
  if(!r){ area.innerHTML=''; return; }
  let rows = '';
  DATA.forEach(sec=>{
    rows += `<tr class="sec-row"><td colspan="3">${sec.code}. ${sec.title}</td></tr>`;
    sec.groups.forEach(g=>{
      rows += `<tr><td colspan="3"><b>${g.num}. ${g.title}</b></td></tr>`;
      g.items.forEach(item=>{
        const val = r.scores ? r.scores[item.id] : null;
        const note = r.notes ? (r.notes[item.id]||'') : '';
        rows += `<tr><td>${item.text}</td><td style="text-align:center;">${val!=null?val:'-'}</td><td>${note}</td></tr>`;
      });
    });
  });
  area.innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;">
      <img src="${LOGO_KEMENAG}" alt="Logo Kementerian Agama" style="width:56px;height:56px;object-fit:contain;flex:none;">
      <div style="flex:1;text-align:center;">
        <h1 style="text-align:center;">KEMENTERIAN AGAMA REPUBLIK INDONESIA</h1>
        <p class="ph-line" style="text-align:center;">KANTOR KEMENTERIAN AGAMA KOTA BALIKPAPAN — MADRASAH ALIYAH NEGERI BALIKPAPAN</p>
        <p class="ph-line" style="text-align:center;">Instrumen Supervisi Akademik (Kurikulum Merdeka) — Supervisi Pelaksanaan Pembelajaran</p>
      </div>
      <img src="${LOGO_MAN}" alt="Logo MAN Balikpapan" style="width:56px;height:56px;object-fit:contain;flex:none;">
    </div>
    <div style="border-bottom:2px solid #111;margin:6px 0 4px;"></div>
    <table>
      <tr><td><b>Nama Sekolah</b></td><td colspan="2">Madrasah Aliyah Negeri Balikpapan</td></tr>
      <tr><td><b>Nama Guru</b></td><td colspan="2">${r.guruNama||'-'}</td></tr>
      <tr><td><b>Mata Pelajaran</b></td><td colspan="2">${r.mapel||'-'}</td></tr>
      <tr><td><b>Kelas/Materi/Topik</b></td><td colspan="2">${r.kelasMateri||'-'}</td></tr>
    </table>
    <table><tr><th>Aspek yang Diamati</th><th>Skor</th><th>Catatan</th></tr>${rows}</table>
    <table>
      <tr><td><b>Skor Total</b></td><td colspan="2">${r.total} / ${MAX_SCORE}</td></tr>
      <tr><td><b>Nilai Akhir</b></td><td colspan="2">${r.nilai.toFixed(1)}%</td></tr>
      <tr><td><b>Ketercapaian</b></td><td colspan="2">${r.status}</td></tr>
    </table>
    <table>
      <tr>
        <td style="width:50%;text-align:center;">Guru yang di Supervisi<br><br><br><br><b>${r.guruNama||''}</b></td>
        <td style="width:50%;text-align:center;">${r.tempat||''}, ${fmtDate(r.tanggal)}<br>Kepala Madrasah / Supervisor<br><br><br><b>${r.supervisorNama||''}</b><br>NIP. ${r.supervisorNip||'-'}</td>
      </tr>
    </table>
  `;
}

/* ============ INIT ============ */
async function init(){
  const session = await getPersonal('session', null);
  if(session){
    state.session = session;
    await loadMaster(); await loadHasilList();
    if(session.role==='admin'){ state.view='admin'; state.adminTab='rekap'; }
    else{
      const draft = await getPersonal('draft', null);
      if(draft){ state.draft = draft; state.view='wizard'; state.step=0; }
      else{ state.view='supervisor-home'; }
    }
  } else {
    state.view='login';
  }
  render();
}
init();
</script>
</body>
</html>
